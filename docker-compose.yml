services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg://competition:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/competition
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CHECK_CREDENTIAL_KEY: ${CHECK_CREDENTIAL_KEY:?Set CHECK_CREDENTIAL_KEY in .env}
      SESSION_COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SCORING_THREADS: ${SCORING_THREADS:-8}
      SCORING_TICK_SECONDS: ${SCORING_TICK_SECONDS:-15}
      DEFAULT_PAYOUT_PER_POINT: ${DEFAULT_PAYOUT_PER_POINT:-10}
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "flask --app app:create_app db upgrade && gunicorn --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile - 'app:create_app()'"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scoring-worker:
    build: .
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: competition
      POSTGRES_USER: competition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competition -d competition"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      ENGINE_DOMAIN: ${ENGINE_DOMAIN:?Set ENGINE_DOMAIN in .env}
      BANK_DOMAIN: ${BANK_DOMAIN:?Set BANK_DOMAIN in .env}
      STORE_DOMAIN: ${STORE_DOMAIN:?Set STORE_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  database-data:
  proxy-data:
  proxy-config:
